name: Deploy to Firebase

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install root dependencies
        run: npm ci

      - name: Install & build client
        working-directory: client
        run: |
          npm ci
          npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          VITE_OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}

      - name: Install & build functions
        working-directory: functions
        run: |
          npm ci
          npm run build

      - name: Decode service account key
        run: echo "$GCP_CREDENTIALS_B64" | base64 -d > /home/runner/gcp-key.json
        env:
          GCP_CREDENTIALS_B64: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}

      - name: Create functions .env.yaml from secrets
        run: |
          cat > functions/.env.yaml << EOF
          RESEND_API_KEY: $RESEND_API_KEY
          RESEND_FROM_EMAIL: $RESEND_FROM_EMAIL
          APP_BASE_URL: $APP_BASE_URL
          OAUTH_CLIENT_ID: $OAUTH_CLIENT_ID
          OAUTH_CLIENT_SECRET: $OAUTH_CLIENT_SECRET
          FUNCTION_HOST: us-central1-billsplitter-v2.cloudfunctions.net
          EOF
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}

      - name: Deploy to Firebase
        run: npx firebase deploy --project billsplitter-v2 --non-interactive --env-vars-file=functions/.env.yaml
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /home/runner/gcp-key.json
